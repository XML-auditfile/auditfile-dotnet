name: CI

on:
  push:
    branches: [main, 'release/**']
  pull_request:
    branches: [main, 'release/**']
  # Also to run CI on a branch whose pull request was opened by a workflow (GITHUB_TOKEN events start no runs).
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same pull request or branch cancels the run that is still busy.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Fetch auditfile-spec (spec.lock.json)
        shell: pwsh
        run: ./tools/fetch-spec.ps1

      # The constants are written from the registry (tools/generate-constants.ps1); they must match the locked spec.
      - name: Check the version constants
        shell: pwsh
        run: ./tools/generate-constants.ps1 -Check

      - name: Build
        run: dotnet build XmlAuditfile.slnx -c Release

      - name: Test
        run: dotnet test --solution XmlAuditfile.slnx -c Release --no-build

  # The one check the branch rules require, whatever the jobs above: it fails when any of them did not succeed.
  ci-passed:
    if: always()
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: All jobs passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for result in $RESULTS; do [ "$result" = success ] || exit 1; done
