name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Fetch auditfile-spec (spec.lock.json)
        shell: pwsh
        run: ./tools/fetch-spec.ps1

      - name: Build
        run: dotnet build XmlAuditfile.Auditfile.slnx -c Release

      - name: Test
        run: dotnet test XmlAuditfile.Auditfile.slnx -c Release --no-build
