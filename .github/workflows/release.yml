name: Release

# Run manually with the new version, e.g. 1.0.1 or 1.1.0-beta.1:
# - from main: the version must be higher than every existing release;
# - from release/X.Y (maintenance of an older line, e.g. a security fix 0.1.1 after 1.0.0):
#   the version must be in line X.Y and higher than the latest release in that line.
#   Branch release/X.Y off the tag of that line, e.g. git switch -c release/0.1 0.1.0.
# Either way the commit must hold commits that the previous release does not.
# Checks the version, fetches the auditfile-spec pinned in spec.lock.json, builds, tests, packs,
# creates the tag and GitHub release, and publishes to NuGet when the NUGET_USER variable is set.
#
# Publishing uses NuGet Trusted Publishing: no API key is stored. GitHub gives this job an OIDC token, and nuget.org
# exchanges it for a key that is valid for one hour, but only for this repository, this workflow file and the
# environment "nuget" (the trusted publishing policy on nuget.org). NUGET_USER is the nuget.org user or
# organization that owns the policy.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version (semver without prefix, e.g. 1.0.1)
        required: true
        type: string

permissions:
  contents: write # tag and GitHub release
  id-token: write # OIDC token for NuGet Trusted Publishing

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    # Protection rules (e.g. a required reviewer) are set on this environment in the repository settings.
    environment: nuget
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # all tags, for the version check

      - name: Check version
        id: version
        shell: pwsh
        run: |
          . ./tools/semver.ps1
          $isLatest = Assert-ReleaseVersion $env:VERSION $env:GITHUB_REF @(git tag --list) $env:GITHUB_SHA
          "latest=$($isLatest.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Fetch auditfile-spec (spec.lock.json)
        id: spec
        shell: pwsh
        run: |
          ./tools/fetch-spec.ps1
          $lock = Get-Content spec.lock.json -Raw | ConvertFrom-Json
          if (-not $lock.tag) {
            Write-Host "::warning::spec.lock.json pins auditfile-spec commit $($lock.commit) without a release tag."
          }
          $label = if ($lock.tag) { $lock.tag } else { $lock.commit.Substring(0, 7) }
          "label=$label" >> $env:GITHUB_OUTPUT
          "url=https://github.com/$($lock.repository)/tree/$($lock.commit)" >> $env:GITHUB_OUTPUT

      - name: Build
        run: dotnet build XmlAuditfile.slnx -c Release -p:Version="$VERSION"

      - name: Test
        run: dotnet test --solution XmlAuditfile.slnx -c Release --no-build

      - name: Pack
        run: dotnet pack XmlAuditfile.slnx -c Release --no-build -p:Version="$VERSION" -o artifacts

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          SPEC_LABEL: ${{ steps.spec.outputs.label }}
          SPEC_URL: ${{ steps.spec.outputs.url }}
          LATEST: ${{ steps.version.outputs.latest }}
        run: |
          prerelease=""
          if [[ "$VERSION" == *-* ]]; then prerelease="--prerelease"; fi
          gh release create "$VERSION" artifacts/*.nupkg artifacts/*.snupkg \
            --target "$GITHUB_SHA" \
            --title "$VERSION" \
            --notes "Built with auditfile-spec [$SPEC_LABEL]($SPEC_URL)." \
            --generate-notes \
            --latest="$LATEST" \
            $prerelease

      # Last, because a NuGet version cannot be deleted (only unlisted).
      - name: Log in to NuGet (Trusted Publishing)
        id: nuget
        if: vars.NUGET_USER != ''
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      # Pushes each .nupkg with the .snupkg next to it (symbols for the nuget.org symbol server).
      - name: Publish to NuGet
        if: vars.NUGET_USER != ''
        env:
          NUGET_API_KEY: ${{ steps.nuget.outputs.NUGET_API_KEY }}
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
