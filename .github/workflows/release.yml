name: Release

# Run manually with the new version, e.g. 1.0.1 or 1.1.0-beta.1:
# - from main: the version must be higher than every existing release;
# - from release/X.Y (maintenance of an older line, e.g. a security fix 0.1.1 after 1.0.0):
#   the version must be in line X.Y and higher than the latest release in that line.
#   Branch release/X.Y off the tag of that line, e.g. git switch -c release/0.1 0.1.0.
# Checks the version, fetches the auditfile-spec pinned in spec.lock.json, builds, tests, packs,
# creates the tag and GitHub release, and publishes to NuGet when the NUGET_API_KEY secret is set.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version (semver without prefix, e.g. 1.0.1)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0 # all tags, for the version check

      - name: Check version
        id: version
        shell: pwsh
        run: |
          . ./tools/semver.ps1
          $isLatest = Assert-ReleaseVersion $env:VERSION $env:GITHUB_REF @(git tag --list)
          "latest=$($isLatest.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Fetch auditfile-spec (spec.lock.json)
        id: spec
        shell: pwsh
        run: |
          ./tools/fetch-spec.ps1
          $lock = Get-Content spec.lock.json -Raw | ConvertFrom-Json
          if (-not $lock.tag) {
            Write-Host "::warning::spec.lock.json pins auditfile-spec commit $($lock.commit) without a release tag."
          }
          $label = if ($lock.tag) { $lock.tag } else { $lock.commit.Substring(0, 7) }
          "label=$label" >> $env:GITHUB_OUTPUT
          "url=https://github.com/$($lock.repository)/tree/$($lock.commit)" >> $env:GITHUB_OUTPUT

      - name: Build
        run: dotnet build XmlAuditfile.Auditfile.slnx -c Release -p:Version=$VERSION

      - name: Test
        run: dotnet test XmlAuditfile.Auditfile.slnx -c Release --no-build

      - name: Pack
        run: dotnet pack XmlAuditfile.Auditfile.slnx -c Release --no-build -p:Version=$VERSION -o artifacts

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          SPEC_LABEL: ${{ steps.spec.outputs.label }}
          SPEC_URL: ${{ steps.spec.outputs.url }}
          LATEST: ${{ steps.version.outputs.latest }}
        run: |
          prerelease=""
          if [[ "$VERSION" == *-* ]]; then prerelease="--prerelease"; fi
          gh release create "$VERSION" artifacts/*.nupkg \
            --target "$GITHUB_SHA" \
            --title "$VERSION" \
            --notes "Built with auditfile-spec [$SPEC_LABEL]($SPEC_URL)." \
            --generate-notes \
            --latest="$LATEST" \
            $prerelease

      # Last, because a NuGet version cannot be deleted.
      - name: Publish to NuGet
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        if: env.NUGET_API_KEY != ''
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
