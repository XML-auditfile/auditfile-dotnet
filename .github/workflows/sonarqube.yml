name: SonarQube

# Manual only: run from the Actions tab. Not on pushes or pull requests.
# Needs the SONAR_TOKEN secret, and automatic analysis switched off in SonarQube Cloud.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sonarqube-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and analyze
    runs-on: windows-latest
    steps:
      - name: Set up JDK 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          java-version: 21
          distribution: 'zulu' # Alternative distribution options are available.

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0 # Shallow clones should be disabled for a better relevancy of analysis

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Fetch auditfile-spec (spec.lock.json)
        shell: pwsh
        run: ./tools/fetch-spec.ps1

      - name: Cache SonarQube Cloud packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~\sonar\cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Cache SonarQube Cloud scanner
        id: cache-sonar-scanner
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}\scanner
          key: ${{ runner.os }}-sonar-scanner
          restore-keys: ${{ runner.os }}-sonar-scanner

      - name: Install SonarQube Cloud scanner and coverage tool
        if: steps.cache-sonar-scanner.outputs.cache-hit != 'true'
        shell: powershell
        run: |
          New-Item -Path ${{ runner.temp }}\scanner -ItemType Directory
          dotnet tool update dotnet-sonarscanner --tool-path ${{ runner.temp }}\scanner
          dotnet tool update dotnet-coverage --tool-path ${{ runner.temp }}\scanner

      - name: Build, test and analyze
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SCANNER: ${{ runner.temp }}\scanner
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          function Check { if ($LASTEXITCODE -ne 0) { throw "Step failed with exit code $LASTEXITCODE." } }

          # spec/ is fetched auditfile-spec content, not code of this repository.
          & "$env:SCANNER\dotnet-sonarscanner" begin /k:"XML-auditfile_auditfile-dotnet" /o:"xml-auditfile" /d:sonar.token="$env:SONAR_TOKEN" `
            /d:sonar.exclusions="spec/**" `
            /d:sonar.cs.vscoveragexml.reportsPaths="coverage.xml"
          Check
          dotnet build XmlAuditfile.Auditfile.slnx --no-incremental
          Check
          & "$env:SCANNER\dotnet-coverage" collect "dotnet test XmlAuditfile.Auditfile.slnx --no-build" -f xml -o coverage.xml
          Check
          & "$env:SCANNER\dotnet-sonarscanner" end /d:sonar.token="$env:SONAR_TOKEN"
          Check
